aid: alife
name: Alife
description: Alife Health is an AI-powered fertility technology company building clinical
  decision-support tools for IVF clinics and fertility patients. Its Alife Assist platform
  integrates directly with clinic EMR systems and layers machine-learning models across
  the IVF cycle - Embryo Predict for AI-assisted embryo assessment and transfer decisions,
  Schedule Predict for optimizing egg-retrieval scheduling, and Success Predictor for
  patient success-likelihood modeling - alongside a patient-facing Alife App. Backed
  by Union Square Ventures. Alife does not currently publish a public API, developer
  portal, or SDK; this profile captures its public web, security, and compliance surface.
